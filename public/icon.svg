<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#1E3F4B" />
      <stop offset="55%" stop-color="#162229" />
      <stop offset="100%" stop-color="#160F0A" />
    </radialGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5AD" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="amberLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="cyanOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="94" fill="url(#glassCard)" stroke="#F5C56B" stroke-opacity="0.45" stroke-width="4" />

  <!-- Outer Glowing Atom Rings -->
  <g transform="translate(256 246)" fill="none" stroke="url(#cyanOrbit)" stroke-width="11" stroke-opacity="0.88">
    <ellipse rx="158" ry="62" transform="rotate(-28)" />
    <ellipse rx="158" ry="62" transform="rotate(28)" />
    <ellipse rx="158" ry="62" transform="rotate(90)" stroke="#FDE047" stroke-opacity="0.6" stroke-width="9" />
  </g>

  <!-- Orbiting Electrons -->
  <circle cx="118" cy="176" r="14" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4" />
  <circle cx="394" cy="316" r="14" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4" />
  <circle cx="256" cy="88" r="13" fill="#FACC15" stroke="#FFFFFF" stroke-width="4" />

  <!-- Central Flask -->
  <g transform="translate(256 254)">
    <path d="M-28 -86 H28 V-34 L78 58 C86 73 75 92 58 92 H-58 C-75 92 -86 73 -78 58 L-28 -34 Z"
          fill="#0F172A" fill-opacity="0.72" stroke="#FFF7E6" stroke-width="9" stroke-linejoin="round" />
    <path d="M-47 22 H47 L67 59 C72 68 65 80 54 80 H-54 C-65 80 -72 68 -67 59 Z"
          fill="url(#amberLiquid)" />
    <rect x="-38" y="-98" width="76" height="16" rx="8" fill="#FFE5AD" />
    <circle cx="-18" cy="48" r="7" fill="#FEF9C3" />
    <circle cx="16" cy="58" r="9" fill="#FEF9C3" />
    <circle cx="4" cy="34" r="5" fill="#FFFFFF" />
  </g>
</svg>
